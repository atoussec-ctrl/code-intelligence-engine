spring.application.name=rag
spring.docker.compose.enabled=false
spring.datasource.url=${RAG_DATABASE_URL:jdbc:postgresql://localhost:5432/rag}
spring.datasource.username=${RAG_DATABASE_USERNAME:rag}
spring.datasource.password=${RAG_DATABASE_PASSWORD:rag}
spring.ai.model.embedding=ollama
spring.ai.ollama.base-url=${RAG_OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.embedding.model=${RAG_EMBEDDING_MODEL:mxbai-embed-large}
spring.rabbitmq.host=${RAG_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RAG_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RAG_RABBITMQ_USERNAME:rag}
spring.rabbitmq.password=${RAG_RABBITMQ_PASSWORD:rag}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=2
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10s
rag.document-processing.dispatcher.enabled=true
rag.document-processing.dispatcher.batch-size=20
rag.document-processing.dispatcher.lease-duration=30s
rag.document-processing.dispatcher.poll-interval=1s
rag.document-processing.publisher-confirm-timeout=5s
server.error.include-message=never
server.error.include-stacktrace=never
