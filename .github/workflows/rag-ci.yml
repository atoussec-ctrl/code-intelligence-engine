name: rag-ci

on:
  push:
    branches:
      - main
    paths:
      - "rag/**"
      - ".github/workflows/rag-ci.yml"
  pull_request:
    paths:
      - "rag/**"
      - ".github/workflows/rag-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Verify Java backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests and coverage gate
        run: mvn clean verify